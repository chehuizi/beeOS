name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

env:
  BEEOOS_ENV: test
  BEEOOS_LOG_LEVEL: WARNING

jobs:
  # === Python 后端 ===
  python:
    name: Python (lint + type-check + test)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.18"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy packages apps

      - name: Test (pytest)
        run: uv run pytest --cov=packages --cov=apps --cov-report=xml --cov-report=term

      - name: Upload coverage
        if: matrix.python-version == '3.12' && github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: python
          fail_ci_if_error: false

  # === 前端 (static HTML) ===
  # M1 阶段 Portal 是手写静态 HTML（apps/portal/*.html + Alpine.js CDN），
  # 无 Node.js / 无构建。V1+ 若引入 Beekeeper Console 子模块再加回 job。
  # 详见 docs/architecture/tech-architecture.md §4.8

  # === 文档检查 (确保 Mermaid 语法合法) ===
  docs:
    name: Docs (markdown lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            docs/**/*.md
            README.md
          config: .markdownlint.json
