[project]
name = "bee"
version = "0.1.0"
description = "Bee 执行引擎 - ReAct 循环 + 模型 AB + 工具调用"
requires-python = ">=3.12"
dependencies = [
    "beeos-core",
    "litellm>=1.50.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bee"]
