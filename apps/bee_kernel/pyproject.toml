[project]
name = "bee-kernel"
version = "0.1.0"
description = "beeOS Kernel - 任务接收 / BOM 拆解 / MES 执行"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
# CLI: bee-kernel [start | submit | list-boms | list-workspaces]
bee-kernel = "bee_kernel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bee_kernel"]
