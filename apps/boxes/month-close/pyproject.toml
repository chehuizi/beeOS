[project]
name = "month-close-box"
version = "0.1.0"
description = "MonthCloseBox - 会计月结自动化 Box（MVP 第一个业务 Box）"
requires-python = ">=3.12"
dependencies = [
    "beeos-core",
    "pydantic>=2.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/month_close"]
