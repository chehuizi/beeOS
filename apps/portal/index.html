<!DOCTYPE html>
<!-- beeOS Portal - 静态 HTML，靠 nginx 直接服务，零 Node.js -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>beeOS Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-gray-50" x-data="beeOS()" x-init="init()">

  <!-- 顶部导航 -->
  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <h1 class="text-xl font-bold text-gray-900">🐝 beeOS</h1>
      <a href="/" class="text-gray-700 hover:text-gray-900">仪表盘</a>
      <a href="/jobs.html" class="text-gray-700 hover:text-gray-900">任务</a>
      <a href="/audit.html" class="text-gray-700 hover:text-gray-900">审计</a>
    </div>
    <div class="text-sm text-gray-500" x-text="now"></div>
  </nav>

  <!-- 主容器 -->
  <main class="max-w-6xl mx-auto px-6 py-8">

    <!-- 加载中 -->
    <div x-show="loading" class="text-center py-12">
      <div class="text-gray-500">加载中...</div>
    </div>

    <!-- 错误 -->
    <div x-show="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded">
      <strong>错误：</strong> <span x-text="error"></span>
    </div>

    <!-- KPI 卡片 -->
    <div x-show="!loading && !error" class="grid grid-cols-4 gap-4 mb-8">
      <div class="bg-white p-6 rounded-lg border border-gray-200">
        <div class="text-sm text-gray-500">Queen 状态</div>
        <div class="text-2xl font-bold mt-1" :class="health.status === 'ok' ? 'text-green-600' : 'text-red-600'" x-text="health.status || 'unknown'"></div>
      </div>
      <div class="bg-white p-6 rounded-lg border border-gray-200">
        <div class="text-sm text-gray-500">本周任务</div>
        <div class="text-2xl font-bold mt-1 text-gray-900" x-text="stats.weeklyJobs">-</div>
      </div>
      <div class="bg-white p-6 rounded-lg border border-gray-200">
        <div class="text-sm text-gray-500">北极星指标</div>
        <div class="text-2xl font-bold mt-1 text-gray-900">周活 Box</div>
      </div>
      <div class="bg-white p-6 rounded-lg border border-gray-200">
        <div class="text-sm text-gray-500">beeOS 版本</div>
        <div class="text-2xl font-bold mt-1 text-gray-900" x-text="health.version || '0.1.0'">0.1.0</div>
      </div>
    </div>

    <!-- 快速操作 -->
    <div x-show="!loading && !error" class="bg-white p-6 rounded-lg border border-gray-200 mb-8">
      <h2 class="text-lg font-semibold mb-4">快速操作</h2>
      <div class="grid grid-cols-3 gap-4">
        <a href="/jobs/new.html" class="block p-4 border border-gray-200 rounded hover:border-blue-500 hover:bg-blue-50">
          <div class="text-2xl mb-2">📊</div>
          <div class="font-semibold">发起月结</div>
          <div class="text-sm text-gray-500 mt-1">提交月结任务，自动跑完 5 步流程</div>
        </a>
        <a href="/jobs.html" class="block p-4 border border-gray-200 rounded hover:border-blue-500 hover:bg-blue-50">
          <div class="text-2xl mb-2">📋</div>
          <div class="font-semibold">查看任务</div>
          <div class="text-sm text-gray-500 mt-1">所有月结 / 报税 / 审计任务</div>
        </a>
        <a href="/audit.html" class="block p-4 border border-gray-200 rounded hover:border-blue-500 hover:bg-blue-50">
          <div class="text-2xl mb-2">🔍</div>
          <div class="font-semibold">审计日志</div>
          <div class="text-sm text-gray-500 mt-1">谁什么时候调了什么（哈希链防篡改）</div>
        </a>
      </div>
    </div>

    <!-- 系统状态 -->
    <div x-show="!loading && !error" class="bg-white p-6 rounded-lg border border-gray-200">
      <h2 class="text-lg font-semibold mb-4">系统状态</h2>
      <div class="space-y-2 text-sm">
        <div class="flex justify-between">
          <span class="text-gray-600">Queen API</span>
          <span class="text-green-600">● <span x-text="'/health: ' + (health.status || 'unknown')"></span></span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600">PostgreSQL</span>
          <span class="text-green-600">● 127.0.0.1:5432</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600">Redis</span>
          <span class="text-green-600">● 127.0.0.1:6379</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-600">Nginx</span>
          <span class="text-green-600">● 0.0.0.0:80</span>
        </div>
      </div>
    </div>

  </main>

  <script>
    function beeOS() {
      return {
        loading: true,
        error: null,
        health: {},
        stats: { weeklyJobs: 0 },
        now: new Date().toLocaleString('zh-CN'),

        async init() {
          // 每秒更新时间
          setInterval(() => {
            this.now = new Date().toLocaleString('zh-CN');
          }, 1000);

          try {
            // 调 Queen /health
            const r = await fetch('/health');
            if (!r.ok) throw new Error('Queen 返回 ' + r.status);
            this.health = await r.json();
          } catch (e) {
            this.error = e.message;
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>

</body>
</html>
