<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发起月结 - beeOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-50" x-data="newJobPage()" x-init="init()">

  <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-6">
    <h1 class="text-xl font-bold text-gray-900">🐝 beeOS</h1>
    <a href="/" class="text-gray-700 hover:text-gray-900">仪表盘</a>
    <a href="/jobs.html" class="text-gray-700 hover:text-gray-900">任务</a>
    <a href="/audit.html" class="text-gray-700 hover:text-gray-900">审计</a>
  </nav>

  <main class="max-w-2xl mx-auto px-6 py-8">

    <h2 class="text-2xl font-bold mb-6">发起月结</h2>

    <div class="bg-white p-6 rounded-lg border border-gray-200">
      <form @submit.prevent="submit()">

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-2">月结期间</label>
          <input type="month" x-model="form.period" required
            class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:border-blue-500">
          <p class="text-xs text-gray-500 mt-1">格式 YYYY-MM，例如 2026-07</p>
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-2">客户范围</label>
          <select x-model="form.scope" class="w-full px-3 py-2 border border-gray-300 rounded">
            <option value="all">全部客户</option>
            <option value="specific">指定客户（多个）</option>
          </select>
        </div>

        <div x-show="form.scope === 'specific'" class="mb-4">
          <label class="block text-sm font-semibold mb-2">客户编号（逗号分隔）</label>
          <input type="text" x-model="form.clients"
            class="w-full px-3 py-2 border border-gray-300 rounded"
            placeholder="A001, A002, A003">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-2">紧急程度</label>
          <select x-model="form.urgency" class="w-full px-3 py-2 border border-gray-300 rounded">
            <option value="normal">一般</option>
            <option value="urgent">紧急</option>
          </select>
        </div>

        <div class="mb-6">
          <label class="block text-sm font-semibold mb-2">备注（≤500 字）</label>
          <textarea x-model="form.notes" maxlength="500" rows="3"
            class="w-full px-3 py-2 border border-gray-300 rounded"
            placeholder="可选：给 Bee 的额外说明"></textarea>
        </div>

        <div x-show="error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded mb-4">
          <strong>错误：</strong> <span x-text="error"></span>
        </div>

        <div x-show="success" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded mb-4">
          <strong>✓ 已提交</strong> 任务 ID: <span x-text="submittedId" class="font-mono"></span>
        </div>

        <div class="flex gap-3">
          <button type="submit" :disabled="submitting"
            class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 disabled:opacity-50">
            <span x-show="!submitting">提交</span>
            <span x-show="submitting">提交中...</span>
          </button>
          <a href="/jobs.html" class="px-6 py-2 border border-gray-300 rounded hover:bg-gray-50">返回</a>
        </div>
      </form>
    </div>

    <div class="mt-6 text-sm text-gray-500">
      <strong>说明：</strong>月结流程包含 5 步（拉余额 → 银行对账 → 费用分类 → 出报表 → 凭证归集 → 发起审批），
      预计耗时 30-60 分钟。
    </div>

  </main>

  <script>
    function newJobPage() {
      return {
        submitting: false,
        error: null,
        success: false,
        submittedId: '',
        form: {
          period: new Date().toISOString().slice(0, 7),
          scope: 'all',
          clients: '',
          urgency: 'normal',
          notes: '',
        },

        async init() {},

        async submit() {
          this.submitting = true;
          this.error = null;
          this.success = false;
          try {
            const payload = {
              bee_type: 'month_close',
              period: this.form.period,
              clients: this.form.scope === 'all' ? [] : this.form.clients.split(',').map(s => s.trim()).filter(Boolean),
              urgency: this.form.urgency,
              notes: this.form.notes,
            };
            const r = await fetch('/api/v0/jobs', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify(payload),
            });
            if (r.status === 404) {
              throw new Error('Queen API 尚未实现 POST /api/v0/jobs（M2 任务，先看任务列表）');
            }
            if (!r.ok) throw new Error('Queen 返回 ' + r.status);
            const data = await r.json();
            this.submittedId = data.job_id;
            this.success = true;
          } catch (e) {
            this.error = e.message;
          } finally {
            this.submitting = false;
          }
        }
      }
    }
  </script>
</body>
</html>
