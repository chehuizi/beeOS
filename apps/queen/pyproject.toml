[project]
name = "queen"
version = "0.1.0"
description = "Queen 调度服务 - beeOS 任务调度大脑"
requires-python = ">=3.12"
dependencies = [
    "beeos-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
]

[project.scripts]
queen = "queen.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/queen"]
