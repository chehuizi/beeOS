# beeOS Nginx 反向代理
# 80/443 → 3000 (Portal) / 8080 (Queen API)
# 部署到 /etc/nginx/conf.d/beeos.conf

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt 验证
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其他请求强制 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL 证书（Let's Encrypt 路径，按实际替换）
    ssl_certificate /etc/nginx/ssl/beeos/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/beeos/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全 headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 上传大小（凭证 / 文档上传）
    client_max_body_size 50m;

    # 通用参数
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;  # 月结任务可能 30 分钟
    proxy_send_timeout 600s;
    proxy_buffering off;

    # Queen API（/api/ → 8080）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Portal（所有其他 → 3000）
    location / {
        proxy_pass http://127.0.0.1:3000;
    }

    # 访问日志 / 错误日志
    access_log /var/log/nginx/beeos.access.log;
    error_log /var/log/nginx/beeos.error.log;
}

# --- 限流（防滥用）---
# 在 http {} 块加：limit_req_zone $binary_remote_addr zone=beeos:10m rate=10r/s;
# 在 location /api/ 加：limit_req zone=beeos burst=20 nodelay;
