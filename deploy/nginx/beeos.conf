# beeOS Nginx 反向代理 - IP-only 配置（demo 阶段，暂无 HTTPS）
# 部署到 /etc/nginx/conf.d/beeos.conf
# 监听 80：
#   - /api/  → 8080 (Queen API)
#   - /health → 8080/health (Queen 健康)
#   - 其他     → /opt/beeos/apps/portal/ 静态 HTML 文件
# 阿里云安全组必须放行 80 端口
# ⚠️ 必须显式按 IP 匹配，不能 default_server（agentbeeline.com 已占 default_server）

server {
    listen 80;
    listen [::]:80;
    server_name 101.37.146.194;

    # 上传大小（凭证 / 文档上传）
    client_max_body_size 50m;

    # 通用代理参数
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 600s;  # 月结任务可能 30 分钟
    proxy_send_timeout 600s;
    proxy_buffering off;

    # Queen API（/api/ → 8080）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }

    # Queen 健康检查（/health → 8080/health）
    location = /health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    # M0 demo server（/m0/ → 8085，无 Queen/Hive 的精简 server）
    # 访问入口：http://101.37.146.194/m0/
    location /m0/ {
        proxy_pass http://127.0.0.1:8085/;  # 末尾 / 去掉 /m0/ 前缀
    }

    # Portal 静态文件（直接 nginx 服务，零 Node.js）
    # 注意：root 必须指向 deploy 脚本实际复制的目录（apps/portal/），
    # 不是历史上的 /opt/beeos/portal/（那个目录是 8/9 装的旧版本，
    # 后续 deploy 不会更新它，导致"菜单没有"的 bug）
    root /opt/beeos/apps/portal;
    index index.html;
    location / {
        try_files $uri $uri/ $uri.html /index.html;
        # 静态 HTML 禁用缓存：每次 deploy 都生效，避免浏览器看到旧版
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 访问日志 / 错误日志
    access_log /var/log/nginx/beeos.access.log;
    error_log /var/log/nginx/beeos.error.log;
}

# --- 限流（防滥用）---
# 在 http {} 块加：limit_req_zone $binary_remote_addr zone=beeos:10m rate=10r/s;
# 在 location /api/ 加：limit_req zone=beeos burst=20 nodelay;
#
# --- 后续 HTTPS 升级备忘（暂不启用）---
# 1. certbot certonly --nginx -d <your-domain>
# 2. 把下面这段加进 server {} 块：
#      listen 443 ssl http2;
#      ssl_certificate /etc/nginx/ssl/<your-domain>/fullchain.pem;
#      ssl_certificate_key /etc/nginx/ssl/<your-domain>/privkey.pem;
#      ssl_protocols TLSv1.2 TLSv1.3;
# 3. 加 80 → 443 redirect server {}
