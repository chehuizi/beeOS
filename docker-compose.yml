# beeOS 开发环境 - Docker Compose
# 对应 [技术架构 §3.1 单机 Compose MVP]
#
# 启动：docker compose up -d
# 停止：docker compose down
# 日志：docker compose logs -f queen

services:
  # === 数据层 ===
  postgres:
    image: pgvector/pgvector:pg16
    container_name: beeos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: beeos
      POSTGRES_USER: beeos
      POSTGRES_PASSWORD: ${BEEOOS_POSTGRES_PASSWORD:-beeos-dev-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beeos -d beeos"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    networks:
      - beeos-net

  redis:
    image: redis:7-alpine
    container_name: beeos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "6379:6379"
    networks:
      - beeos-net

  # === 调度层 ===
  queen:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: beeos-queen
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BEEOOS_ENV: development
      BEEOOS_POSTGRES_HOST: postgres
      BEEOOS_REDIS_HOST: redis
      BEEOOS_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - beeos-net
    volumes:
      - box-data:/var/lib/beeos/boxes

  # === 交互层 ===
  portal:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.frontend
    container_name: beeos-portal
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://queen:8080
    depends_on:
      - queen
    ports:
      - "3000:3000"
    networks:
      - beeos-net

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  box-data:
    driver: local

networks:
  beeos-net:
    driver: bridge
