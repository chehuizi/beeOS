[project]
name = "beeos-core"
version = "0.1.0"
description = "beeOS Core - 跨服务共享代码（M0 精简版：只保留 config + logging）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.4.0",
]

# M0 暂时不用的依赖（V1+ 恢复时取消注释）：
# - sqlalchemy[asyncio]>=2.0.30      # ORM (Hive 恢复)
# - asyncpg>=0.29.0                  # PG async driver
# - redis[hiredis]>=5.0.0            # 缓存 / 任务队列
# - opentelemetry-*                  # 遥测
# - cryptography>=43.0.0             # Guardian AES-GCM
# - httpx>=0.27.0                    # LLM HTTP client

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beeos_core"]
