[project]
name = "beeos"
version = "0.1.0"
description = "beeOS - Business Fulfillment Operating System"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    # runtime/llm.py 在模块顶层 import httpx，是硬依赖。
    # 之前漏声明，本地 .venv 里碰巧装了所以一直没暴露；部署到干净
    # 环境时直接 ModuleNotFoundError 起不来。
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "core",
    "boxes",
    "boxes.inventory_shortage",
    "boxes.modeling",
    "beelines",
    "beelines.inventory_shortage",
    "beelines.modeling",
    "runtime",
    "kanban",
    "tests",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]