[project]
name = "beeos"
version = "0.1.0"
description = "beeOS - Business Fulfillment Operating System"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "core",
    "boxes",
    "boxes.inventory_shortage",
    "beelines",
    "beelines.inventory_shortage",
    "runtime",
    "tests",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]